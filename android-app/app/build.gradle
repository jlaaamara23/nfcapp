plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nfcattendance.employee'
    compileSdk 36

    defaultConfig {
        applicationId "com.nfcattendance.employee"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "1.0.4"
        // Production API (Play Store / VPS). For local LAN testing temporarily use http://YOUR_PC_IP:8080
        buildConfigField "String", "API_BASE_URL", "\"https://api.sreamline.tech\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}
