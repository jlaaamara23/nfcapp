server:
  port: 8080

spring:
  application:
    name: nfc-attendance-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nfc_attendance}
    username: ${SPRING_DATASOURCE_USERNAME:nfc_attendance}
    password: ${SPRING_DATASOURCE_PASSWORD:nfc_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  attendance:
    duplicate-window-seconds: 60
    default-grace-minutes: 10
    default-timezone: Asia/Jerusalem
  security:
    max-failed-logins: 5
    lockout-minutes: 15

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.nfcattendance: INFO
