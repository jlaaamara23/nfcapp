spring:
  datasource:
    url: jdbc:h2:mem:nfc_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  seed:
    enabled: false
  jwt:
    secret: test-secret-key-must-be-at-least-32-characters-long
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  attendance:
    duplicate-window-seconds: 60
    default-grace-minutes: 10
    default-timezone: Asia/Jerusalem
  security:
    max-failed-logins: 5
    lockout-minutes: 15
