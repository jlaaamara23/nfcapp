services:
  db:
    image: postgres:16-alpine
    container_name: nfc-attendance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nfc_attendance}
      POSTGRES_USER: ${POSTGRES_USER:-nfc_attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nfc_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nfc-attendance-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/nfc_attendance}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-nfc_attendance}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-nfc_dev_password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://2.24.44.228:5173,http://2.24.44.228}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
    ports:
      - "8080:8080"

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://2.24.44.228:8080}
    container_name: nfc-attendance-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
